[workspace]
members = [
    ".", "libs/image",
    "libs/pixiv"
]

[[bin]]
name = "nenechi-cli"

[package]
name = "nenechi-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
nenechi-pixiv = { path = "libs/pixiv" }
nenechi-image = { path = "libs/image" }
clap = { version = "4.5.41", features = ["derive"] }
