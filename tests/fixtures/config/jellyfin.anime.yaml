jellyfin:
  targets:
    - name: anime
      type: series
      source: tmp/anime/source
      destination: tmp/anime/destination

      series:
        category: anime
        episode:
          patterns:
            - '(?<episode>[0-9]+)\.mp4'

      include:
        - '*.mkv'
        - '*.mp4'
        - '*.avi'

      ignore:
        - 'Ignored *'
        - '**/*.part'
