logging:
  # Nivel de log: trace, debug, info, warn, error.
  level: debug
  # Los logs se escriben simultáneamente en la consola y en este fichero.
  file: tmp/nenechi.log

database:
  # Ruta del fichero de la base de datos
  file: tmp/nenechi-cli.db

myanimelist:
  # Client ID de la API v2 de MyAnimeList.
  api_key: $MYANIMELIST_API_KEY
